name: StudioSatV2
options:
  bundleIdPrefix: br.com.studiosatweb
  deploymentTarget:
    iOS: "17.0"
targets:
  StudioSatV2:
    type: application
    platform: iOS
    sources: [StudioSatV2]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.studiosatweb.radio.v2
        SWIFT_VERSION: 6.0
    info:
      path: StudioSatV2/Info.plist
      properties:
        UIBackgroundModes: [audio]
