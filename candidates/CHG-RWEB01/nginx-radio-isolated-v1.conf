# StudioSat Web — Radio-only public routing
# Installed by CHG-RWEB01 after radio hostnames are removed from the shared TV/Radio blocks.

server {
    listen 80;
    listen [::]:80;
    server_name radio.studiosatweb.com.br radioprincipal.studiosatweb.com.br radiopop.studiosatweb.com.br radiorock.studiosatweb.com.br radioclassicas.studiosatweb.com.br radiocountry.studiosatweb.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radio.studiosatweb.com.br radioprincipal.studiosatweb.com.br radiopop.studiosatweb.com.br radiorock.studiosatweb.com.br radioclassicas.studiosatweb.com.br radiocountry.studiosatweb.com.br;

    ssl_certificate /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;

    root /var/www/studiosat-radio-player;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(radioprincipal|radiopop|radiorock|radioclassicas|radiocountry)/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

