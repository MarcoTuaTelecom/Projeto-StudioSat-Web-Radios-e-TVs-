# StudioSat TVKIDS — isolated public recovery v1
# Owns TVKIDS hostnames only. Does not alter Radio vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br;

    ssl_certificate     /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;

    root /var/www/studiosat-tv/current;
    index index.html;

    add_header X-StudioSat-TV-Owner "tvkids-recovery-v1" always;
    add_header X-StudioSat-TV-Station "tvkids" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-StudioSat-TV-Owner "tvkids-recovery-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-StudioSat-TV-Owner "tvkids-recovery-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location = /tvkids.html { return 302 /; }

    location = /healthz {
        default_type text/plain;
        return 200 "STUDIOSAT_TVKIDS_RECOVERY_V1_OK\n";
        add_header X-StudioSat-TV-Owner "tvkids-recovery-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location ^~ /tvkids/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-StudioSat-TV-Owner "tvkids-recovery-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location / { return 404; }
}
