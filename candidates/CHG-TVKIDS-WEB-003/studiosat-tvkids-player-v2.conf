# StudioSat TVKIDS — dedicated public vhost for fullscreen resilient player
# Change: CHG-TVKIDS-WEB-003
# This file owns only the four TVKIDS public names and does not edit Radio vhosts.
server {
    listen 80;
    listen [::]:80;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br;

    ssl_certificate     /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;

    root /var/www/studiosat-tv-player;
    index index.html;

    add_header X-StudioSat-TV "tvkids-player-v2" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-StudioSat-TV "tvkids-player-v2" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-StudioSat-TV "tvkids-player-v2" always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "STUDIOSAT_TVKIDS_PLAYER_V2_OK\n";
        add_header X-StudioSat-TV "tvkids-player-v2" always;
    }

    # Legacy page name lands on the same television player.
    location = /tvkids.html {
        return 302 /;
    }

    # MediaMTX HLS for the TVKIDS path. URI is preserved: /tvkids/...
    location ^~ /tvkids/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-StudioSat-TV "tvkids-player-v2" always;
    }
}
