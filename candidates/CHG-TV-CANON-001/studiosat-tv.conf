# StudioSat Web — TV public canonical owner v1
# Change: CHG-TV-CANON-001
# This is the ONLY production NGINX file allowed to own StudioSat TV hostnames.

server {
    listen 80;
    listen [::]:80;
    server_name
        tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br
        tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br
        tvteens.studiosatweb.com.br www.tvteens.studiosatweb.com.br
        tvviva.studiosatweb.com.br www.tvviva.studiosatweb.com.br
        tvmaisjovem.studiosatweb.com.br www.tvmaisjovem.studiosatweb.com.br;
    return 301 https://$host$request_uri;
}

# TVKIDS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br;

    ssl_certificate     /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;

    root /var/www/studiosat-tv/current;
    index index.html;

    add_header X-StudioSat-TV-Owner "canonical-v1" always;
    add_header X-StudioSat-TV-Station "tvkids" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-StudioSat-TV-Owner "canonical-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-StudioSat-TV-Owner "canonical-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location = /tvkids.html { return 302 /; }
    location = /healthz {
        default_type text/plain;
        return 200 "STUDIOSAT_TV_CANONICAL_V1 tvkids\n";
        add_header X-StudioSat-TV-Owner "canonical-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location ^~ /tvkids/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-StudioSat-TV-Owner "canonical-v1" always;
        add_header X-StudioSat-TV-Station "tvkids" always;
    }

    location / { return 404; }
}

