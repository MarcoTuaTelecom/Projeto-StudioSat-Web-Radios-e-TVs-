# StudioSat TV — dedicated vhost, isolated from Radio
# CHG-TV-RESTORE-001
server {
    listen 80;
    listen [::]:80;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br tvteens.studiosatweb.com.br www.tvteens.studiosatweb.com.br tvviva.studiosatweb.com.br www.tvviva.studiosatweb.com.br tvmaisjovem.studiosatweb.com.br www.tvmaisjovem.studiosatweb.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br tvteens.studiosatweb.com.br www.tvteens.studiosatweb.com.br tvviva.studiosatweb.com.br www.tvviva.studiosatweb.com.br tvmaisjovem.studiosatweb.com.br www.tvmaisjovem.studiosatweb.com.br;

    ssl_certificate     /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;

    root /var/www/studiosat-tv-player;
    index index.html;
    add_header X-StudioSat-TV "tv-player-v1" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-StudioSat-TV "tv-player-v1" always;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "STUDIOSAT_TV_V1_OK\n";
        add_header X-StudioSat-TV "tv-player-v1" always;
    }

    # Compatibilidade com URLs legadas das páginas TV.
    location ~ ^/(tvkids|tvteens|tvviva|tvmaisjovem)\.html$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-StudioSat-TV "tv-player-v1" always;
    }

    location ~ ^/(tvkids|tvteens|tvviva|tvmaisjovem)/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_buffering off;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        add_header X-StudioSat-TV "tv-player-v1" always;
    }
}
