<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio Sat TV — Ao Vivo</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070b;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}body{overflow:hidden}.stage{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 20%,#17233a 0,#070b13 40%,#020305 100%)}video{width:100%;height:100%;object-fit:contain;background:#000}.top{position:absolute;left:0;right:0;top:0;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.78),transparent);pointer-events:none}.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(18px,2.4vw,34px)}.brand b{color:#ff1744}.live{font-size:13px;font-weight:800;letter-spacing:.14em;padding:8px 12px;border-radius:999px;background:#d5002f;box-shadow:0 0 24px rgba(255,0,56,.45)}.bottom{position:absolute;left:18px;right:18px;bottom:18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.card{max-width:680px;background:rgba(7,10,17,.78);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);padding:14px 18px;border-radius:16px}.station{font-weight:900;font-size:clamp(20px,3vw,38px)}.status{font-size:13px;opacity:.78;margin-top:4px}.actions{display:flex;gap:10px}.btn{border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.65);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.err{color:#ff8a9c}.ok{color:#79f2a6}@media(max-width:680px){.bottom{flex-direction:column;align-items:stretch}.actions{justify-content:flex-end}}
</style></head><body><main class="stage"><video id="v" controls playsinline preload="auto"></video><div class="top"><div class="brand">STUDIO SAT <b>TV</b></div><div class="live">● AO VIVO</div></div><div class="bottom"><div class="card"><div id="station" class="station">Studio Sat TV</div><div id="status" class="status">Conectando…</div></div><div class="actions"><button id="play" class="btn">▶ Reproduzir</button><button id="fs" class="btn">⛶ Tela cheia</button></div></div></main>
<script>
const host=location.hostname.toLowerCase();let id='tvkids',name='TVKIDS';
if(host.includes('tvteens')){id='tvteens';name='TVTEENS'}else if(host.includes('tvviva')){id='tvviva';name='TVVIVA'}else if(host.includes('tvmaisjovem')){id='tvmaisjovem';name='TV MAIS JOVEM'}
document.getElementById('station').textContent='STUDIO SAT — '+name;
const v=document.getElementById('v'),status=document.getElementById('status'),url='/'+id+'/index.m3u8';let hls;
function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
function attach(){if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,maxBufferLength:30,liveSyncDurationCount:3});hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus('Sinal ao vivo disponível','ok');v.play().catch(()=>setStatus('Sinal pronto — toque em Reproduzir','ok'))});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)setStatus('Reconectando ao sinal…','err')});}else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.addEventListener('loadedmetadata',()=>{setStatus('Sinal ao vivo disponível','ok');v.play().catch(()=>{})});}else setStatus('Navegador sem suporte HLS','err')}
document.getElementById('play').onclick=()=>v.paused?v.play():v.pause();document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.();v.addEventListener('playing',()=>setStatus('AO VIVO','ok'));v.addEventListener('waiting',()=>setStatus('Bufferizando…'));attach();
</script></body></html>
