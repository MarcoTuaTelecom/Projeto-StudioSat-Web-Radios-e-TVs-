<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Studio Sat TV</title>
<style>
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#sound{position:absolute;top:14px;right:14px;z-index:5;border:0;border-radius:999px;padding:10px 14px;background:rgba(0,0,0,.58);color:#fff;font-weight:700;font-size:13px;backdrop-filter:blur(8px);cursor:pointer;opacity:.82}
#sound.hidden{display:none}
#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;color:#fff;background:rgba(0,0,0,.62);padding:12px 16px;border-radius:10px;font-size:14px;display:none}
#status.show{display:block}
</style>
</head>
<body>
<main id="stage">
  <video id="video" autoplay muted playsinline preload="auto"></video>
  <button id="sound" type="button">Ativar som</button>
  <div id="status">Conectando…</div>
</main>
<script src="/assets/hls.min.js"></script>
<script>
(()=>{'use strict';
const STREAM='/tvkids/index.m3u8';
const v=document.getElementById('video');
const sound=document.getElementById('sound');
const status=document.getElementById('status');
let hls=null,lastTime=-1,lastMove=Date.now(),recoveries=0;
function msg(t,on=true){status.textContent=t;status.classList.toggle('show',on)}
async function play(){try{await v.play();msg('',false)}catch(e){msg('Toque em “Ativar som” para iniciar',true)}}
function destroy(){try{hls&&hls.destroy()}catch(_){}hls=null}
function build(){destroy();msg('Conectando…',true);
  if(window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:false,backBufferLength:30,maxBufferLength:30,maxMaxBufferLength:60,liveSyncDurationCount:3,liveMaxLatencyDurationCount:8,manifestLoadingMaxRetry:8,levelLoadingMaxRetry:8,fragLoadingMaxRetry:8});
    hls.attachMedia(v);
    hls.on(Hls.Events.MEDIA_ATTACHED,()=>hls.loadSource(STREAM));
    hls.on(Hls.Events.MANIFEST_PARSED,()=>play());
    hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;recoveries++;if(d.type===Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad(-1)}catch(_){setTimeout(build,1000)}}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError()}catch(_){setTimeout(build,1000)}}else setTimeout(build,1000)});
  } else if(v.canPlayType('application/vnd.apple.mpegurl')) {v.src=STREAM;v.addEventListener('loadedmetadata',play,{once:true});}
  else msg('Navegador sem suporte HLS',true);
}
sound.addEventListener('click',async()=>{v.muted=false;try{await v.play()}catch(_){}sound.classList.add('hidden');try{await document.documentElement.requestFullscreen?.()}catch(_){}});
v.addEventListener('playing',()=>msg('',false));
v.addEventListener('waiting',()=>msg('Bufferizando…',true));
v.addEventListener('error',()=>{msg('Reconectando…',true);setTimeout(build,1000)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{hls&&hls.startLoad(-1)}catch(_){}play()}});
setInterval(()=>{if(!v.paused&&v.readyState>=2&&v.currentTime>lastTime+.05){lastTime=v.currentTime;lastMove=Date.now()}else if(!document.hidden&&Date.now()-lastMove>15000){lastMove=Date.now();try{hls&&hls.startLoad(-1)}catch(_){}build()}},5000);
build();
})();
</script>
</body>
</html>
