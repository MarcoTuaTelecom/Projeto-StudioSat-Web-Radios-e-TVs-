# StudioSat TV — estado inicial pleno 2026-09-14
# SOMENTE TV. TVKIDS e aliases TVTEENS exibem o mesmo sinal TVKIDS.

# HTTP -> HTTPS para nomes cobertos pelo certificado studiosatweb-completo
server {
    listen 80;
    listen [::]:80;
    server_name
        tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br
        tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br
        tvteens.studiosatweb.com.br www.tvteens.studiosatweb.com.br
        tvviva.studiosatweb.com.br www.tvviva.studiosatweb.com.br
        tvmaisjovem.studiosatweb.com.br www.tvmaisjovem.studiosatweb.com.br;
    return 301 https://$host$request_uri;
}

# HTTP do alias tvteensweb: preserva ACME e redireciona o restante para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tvteensweb.studiosatweb.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

# TVKIDS — sinal único em produção.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tvkids.studiosatweb.com.br www.tvkids.studiosatweb.com.br tvkidsweb.studiosatweb.com.br www.tvkidsweb.studiosatweb.com.br;
    ssl_certificate /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;
    root /var/www/studiosat-tv/current;
    index index.html;
    add_header X-StudioSat-TV-Owner "initial-plena-v1" always;
    add_header X-StudioSat-TV-State "live" always;
    add_header X-StudioSat-TV-Source "tvkids" always;
    location = / { try_files /index.html =404; add_header Cache-Control "no-store" always; add_header X-StudioSat-TV-State "live" always; add_header X-StudioSat-TV-Source "tvkids" always; }
    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-store" always; }
    location ^~ /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=604800, immutable" always; }
    location ^~ /tvkids/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8888;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-StudioSat-TV-Source "tvkids" always;
    }
    location = /healthz { default_type text/plain; return 200 "STUDIOSAT_TVKIDS_LIVE\n"; }
    location / { return 404; }
}

# TVTEENS principal + www: alias público da TVKIDS; playout TVTEENS permanece pausado.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tvteens.studiosatweb.com.br www.tvteens.studiosatweb.com.br;
    ssl_certificate /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;
    root /var/www/studiosat-tv/current;
    index index.html;
    add_header X-StudioSat-TV-Owner "initial-plena-v1" always;
    add_header X-StudioSat-TV-State "alias-live" always;
    add_header X-StudioSat-TV-Source "tvkids" always;
    location = / { try_files /index.html =404; add_header Cache-Control "no-store" always; add_header X-StudioSat-TV-State "alias-live" always; add_header X-StudioSat-TV-Source "tvkids" always; }
    location = /index.html { try_files /index.html =404; add_header Cache-Control "no-store" always; }
    location ^~ /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=604800, immutable" always; }
    location ^~ /tvkids/ { proxy_pass http://127.0.0.1:8888; proxy_http_version 1.1; proxy_set_header Host 127.0.0.1:8888; proxy_buffering off; proxy_request_buffering off; add_header Cache-Control "no-cache, no-store, must-revalidate" always; add_header X-StudioSat-TV-Source "tvkids" always; }
    location ~ ^/tvteens/(.*)$ { rewrite ^/tvteens/(.*)$ /tvkids/$1 break; proxy_pass http://127.0.0.1:8888; proxy_http_version 1.1; proxy_set_header Host 127.0.0.1:8888; proxy_buffering off; add_header Cache-Control "no-cache, no-store, must-revalidate" always; add_header X-StudioSat-TV-Source "tvkids" always; }
    location = /healthz { default_type text/plain; return 200 "STUDIOSAT_TVTEENS_ALIAS_TVKIDS\n"; }
    location / { return 404; }
}

