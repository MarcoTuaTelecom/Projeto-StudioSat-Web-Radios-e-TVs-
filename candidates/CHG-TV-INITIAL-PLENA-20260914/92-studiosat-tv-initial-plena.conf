# TVVIVA e TVMAISJOVEM: explicitamente pausadas, sem fallback para Rádio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tvviva.studiosatweb.com.br www.tvviva.studiosatweb.com.br tvmaisjovem.studiosatweb.com.br www.tvmaisjovem.studiosatweb.com.br;
    ssl_certificate /etc/letsencrypt/live/studiosatweb-completo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studiosatweb-completo/privkey.pem;
    add_header X-StudioSat-TV-Owner "initial-plena-v1" always;
    add_header X-StudioSat-TV-State "paused" always;
    default_type text/html;
    return 503 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Sat TV</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;text-align:center}h1{font-size:clamp(28px,6vw,64px);margin:0}p{opacity:.7}</style></head><body><main><h1>STUDIO SAT TV</h1><p>Emissora temporariamente pausada</p></main></body></html>';
}
